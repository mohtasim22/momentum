name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that's still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, types, tests, build
    # Pinned: ubuntu-latest moves to a brand-new image in October 2026
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # A real Postgres for the integration tests. The official image defaults
    # to an English collation, which is exactly why task.position is COLLATE "C".
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: momentum_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The app needs these to build; nothing here is a real secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/momentum_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-real-0123456789
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests (real Postgres)
        run: npm run test:integration

      - name: Build
        run: npm run build
